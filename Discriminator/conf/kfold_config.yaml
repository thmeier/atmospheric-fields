# Base directory for all default NetCDF inputs. Defaults to ./data unless the
# DATA_DIR environment variable is set. Upper-air inputs live below
# `${data_dir}/nonsurf`.
data_dir: ${oc.env:DATA_DIR,data}

# Config used by child train_discriminator.py runs launched from train_kfold.py.
child_config_name: "kfold_config"

# ERA5/reference file used for training real samples.
real_nc_file: "${data_dir}/nonsurf/era5-gt_1.5deg_2004-01-01_2023-12-31.nc"

# Forecast files used as fake samples during discriminator training. This can be
# a single string or a YAML list.
fake_nc_file:
  - "${data_dir}/nonsurf/era5-forecast_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/nonsurf/fuxi_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/nonsurf/graphcast_6steps_1.5deg_2018-01-01_2018-12-31.nc"
  - "${data_dir}/nonsurf/graphcast_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/nonsurf/ifs-hres_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/nonsurf/keisler_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/nonsurf/neuralgcm_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/nonsurf/pangu_6steps_1.5deg_2018-01-01_2018-12-31.nc"
  - "${data_dir}/nonsurf/pangu_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/nonsurf/sphericalcnn_6steps_1.5deg_2020-01-01_2020-12-31.nc"

# Input channels. Set `variables: null` to train/evaluate with only
# `selected_variable`.
variables:
  - "temperature"
  - "u_component_of_wind"
  - "v_component_of_wind"
  # - "specific_humidity"
  # TODO: Add/remove nonsurf fields once the final NetCDF variable list is known
  # (for example `geopotential`, if present and intended).

# Field used by single-variable analysis scripts and output filenames.
selected_variable: "temperature"

# Optional pressure level selector for upper-air data. Uses 850 hPa fields.
level: 850

# Real/reference time ranges used for training and normalization statistics.
# For k-fold, this is the complement of the forecast-model time union below, so
# ERA5 samples from forecast evaluation periods are not seen as real training
# examples.
train_real_range:
  - ["2004-01-01", "2017-12-31"]
  - ["2019-01-01", "2019-12-31"]
  - ["2021-01-01", "2023-12-31"]

# Forecast initialization-time ranges used for fake training samples. These are
# the union of the configured forecast-model files.
train_fake_range:
  - ["2018-01-01", "2018-12-31"]
  - ["2020-01-01", "2020-12-31"]

# Real/reference holdout ranges use the same model-time union, so test-time
# ERA5 covers the periods that were excluded from real training samples.
test_real_ranges:
  - ["2018-01-01", "2018-12-31"]
  - ["2020-01-01", "2020-12-31"]

# Forecast-model test ranges also use the model-time union.
test_fake_range:
  - ["2018-01-01", "2018-12-31"]
  - ["2020-01-01", "2020-12-31"]

# Forecast lead times, in hours, to include from files with a
# prediction_timedelta dimension.
lead_times: [6, 12, 24, 48, 96, 192]

# Analysis subsample cap. `0` means use all available samples; plotting scripts
# may still impose their own small defaults for expensive visual grids.
max_samples: 0

# Samples per optimizer step or inference batch.
batch_size: 64

# Number of full training epochs.
epochs: 3

# AdamW learning rate.
learning_rate: 1e-4

# Backbone architecture. Supported values: "squeezenet", "resnet18".
model_name: "squeezenet"

# DataLoader worker processes.
num_workers: 4

# If true, fake samples include model forecasts, corrupted ERA5, and corrupted
# forecasts. If false, only model forecasts are labeled fake.
augment: true

# Probability of corrupting a sample in unbalanced/evaluation dataset mode.
# Balanced training uses the explicit fake category mixture instead.
augment_prob: 0.5

# Probability that each channel is selected when applying a fieldwise corruption.
# At least one channel is always corrupted.
field_corruption_prob: 0.5

# Training-time augmentation corruption pool for the model k-fold experiment.
# These names are consumed by scripts/train_discriminator.py. HF noise and wind
# vector rotation are deliberately excluded here and listed below as held-out
# corruption probes.
corruption_types:
  - "gaussian_blur"
  - "grf"
  - "pixel_replace"
  - "wind_patch_shuffle"

# Corruption families intentionally held out from training-time augmentation.
held_out_corruption_types:
  - "hf_noise"
  - "wind_rotation"

# Leave-one-corruption-group-out experiment. These must be train-time
# corruptions from scripts/train_discriminator.py. The wind corruptions assume
# U/V channels are present in `variables`.
corruption_kfold_types:
  - "gaussian_blur"
  - "hf_noise"
  - "grf"
  - "pixel_replace"
  - "wind_patch_shuffle"
  - "wind_rotation"

# Each entry is one fold's held-out corruption list. The model for that fold is
# trained on `corruption_kfold_types` minus this list.
corruption_kfold_holdouts:
  - ["hf_noise", "wind_rotation"]
  - ["gaussian_blur", "grf"]
  - ["pixel_replace", "wind_patch_shuffle"]

# Number of corruption strengths evaluated per corruption family.
corruption_kfold_plot_steps: 7

# ERA5 samples per corruption-strength point during plotting.
corruption_kfold_eval_samples: 100

# Distributional spatial-realism metric baseline. These compare candidate
# sample distributions against the ERA5/reference distribution, without
# per-sample forecast/truth pairing.
standard_metric_real_nc_file: "${data_dir}/nonsurf/era5-gt_1.5deg_2004-01-01_2023-12-31.nc"
standard_metric_comparison_files:
  "GraphCast": "${data_dir}/nonsurf/graphcast_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "Pangu-Weather": "${data_dir}/nonsurf/pangu_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "FuXi": "${data_dir}/nonsurf/fuxi_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "Keisler": "${data_dir}/nonsurf/keisler_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "NeuralGCM": "${data_dir}/nonsurf/neuralgcm_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "SphericalCNN": "${data_dir}/nonsurf/sphericalcnn_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "IFS HRES": "${data_dir}/nonsurf/ifs-hres_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "ERA5 Forecast": "${data_dir}/nonsurf/era5-forecast_6steps_1.5deg_2020-01-01_2020-12-31.nc"
standard_metric_test_fake_range:
  - ["2020-01-01", "2020-12-31"]
standard_metric_test_real_ranges:
  - ["2020-01-01", "2020-12-31"]
standard_metrics:
  - "mean_bias"
  - "std_ratio_error"
  - "crps_like_field_energy"
  # This is the expensive metric: one zonal FFT per sample/field.
  - "zonal_energy_spectrum_l2"
  - "zonal_energy_spectrum_log_l2"
  - "sliced_wasserstein"
  - "sliced_wasserstein_lon_corrected"
  - "mmd_rbf"
  - "scwd"

# Defaults metric baselines to a single scalar temperature field. Override with
# a list of variables to evaluate multi-field metric extensions.
standard_metric_variables:
  - "temperature"

# Forecast/ERA5 samples per lead or corruption-strength point.
standard_metric_eval_samples: 100

# Drop invalid fields such as all-zero or near-constant forecast samples before
# computing distribution baselines. This protects against zero-filled missing
# fields in forecast files.
standard_metric_filter_invalid_fields: true
standard_metric_invalid_zero_atol: 1e-12
standard_metric_invalid_min_std: 1e-12

# Scalar field values retained per variable for mean and standard-deviation
# summaries.
standard_metric_value_samples: 20000

# CRPS-like field energy uses pairwise cosine-latitude-weighted L1 distances
# between complete fields. Smaller chunks reduce memory at the cost of runtime.
standard_metric_field_energy_chunk_size: 4

# Metric kernel backend for the expensive distribution metrics. `auto` uses
# CUDA Torch kernels when available and falls back to NumPy otherwise.
standard_metric_backend: "auto"
standard_metric_device: null
standard_metric_dtype: "float32"

# Bootstrap resamples used for metric error bars and percentile CIs. Set samples
# to 0 to disable when doing quick smoke runs.
# Use 0 for routine baseline runs; set to 32 or more for final error-bar plots.
standard_metric_bootstrap_samples: 0
standard_metric_bootstrap_seed: 0
standard_metric_bootstrap_ci: 0.95

# Sliced-Wasserstein settings. `standard_metric_swd_pixels` caps the flattened
# spatial dimensions used per field; `standard_metric_swd_projections` controls
# the number of random 1D projections.
standard_metric_swd_pixels: 4096
standard_metric_swd_projections: 64
standard_metric_swd_seed: 0
standard_metric_spectrum_log_eps_factor: 1e-12

# RBF-MMD settings. The default null bandwidth uses the pooled median-distance
# heuristic on ERA5-standardized, cosine-latitude-weighted field vectors.
standard_metric_mmd_bandwidth: null
standard_metric_mmd_standardize: true

# SCWD settings following Garrett et al. (2024): a 60x120 convolution-center
# grid, 361x720 nearest-neighbor approximation grid, 1000 km compact Wendland
# radius, r=2, and 200 quantiles. For multi-field metrics, each spatial filter
# is paired with random unit channel weights so it maps the joint state to a
# scalar response before the usual 1D Wasserstein/quantile comparison.
standard_metric_scwd_anchor_lat_points: 60
standard_metric_scwd_anchor_lon_points: 120
standard_metric_scwd_domain_lat_points: 361
standard_metric_scwd_domain_lon_points: 720
standard_metric_scwd_radius_km: 1000.0
standard_metric_scwd_order: 2.0
standard_metric_scwd_quantiles: 200
standard_metric_scwd_channel_projections: 16

# Defaults to `corruption_kfold_types` when null.
standard_metric_corruptions: null
standard_metric_corruption_steps: 7
standard_metric_corruption_max_severity: 2.0

# Maximum sampled corruption severity.
corruption_severity_max: 1.0

# Severity sampler exponent. Values > 1 bias samples toward weaker corruptions.
corruption_severity_power: 2.0

# Optional fixed corruption override for targeted disturbance training/evaluation.
# Leave null/0.0 for the random corruption policy.
disturb_type: null
disturb_level: 0.0

# Lightning precision setting. The trainer falls back to 32-bit on CPU.
precision: "16-mixed"

# Logging
#   csv: local CSV logs under output_dir/lightning_logs (default, no W&B needed)
#   wandb: log to Weights & Biases using project_name
#   none: disable Lightning experiment logging
logger: "csv"

# W&B project name when logger="wandb"; also used as the base name for k-fold
# project overrides.
project_name: "weather-discriminator"

# Destination for model weights, plots, local CSV logs, and cache files.
output_dir: "results"

# Destination for k-fold discriminator checkpoints. Plots remain under
# `output_dir`.
kfold_checkpoint_dir: "${output_dir}/kfold_checkpoints"

# Destination for leave-one-corruption-out checkpoints. Plots remain under
# `output_dir`.
corruption_kfold_checkpoint_dir: "${output_dir}/corruption_kfold_checkpoints"

# Named files used by comparison plots and k-fold training. Numerical models are
# intentionally excluded from the neural-model training pool in scripts/train_kfold.py.
comparison_files:
  "GraphCast": "${data_dir}/nonsurf/graphcast_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "Pangu-Weather": "${data_dir}/nonsurf/pangu_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "FuXi": "${data_dir}/nonsurf/fuxi_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "Keisler": "${data_dir}/nonsurf/keisler_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "NeuralGCM": "${data_dir}/nonsurf/neuralgcm_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "SphericalCNN": "${data_dir}/nonsurf/sphericalcnn_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "IFS HRES": "${data_dir}/nonsurf/ifs-hres_6steps_1.5deg_2020-01-01_2020-12-31.nc"
  "ERA5 Forecast": "${data_dir}/nonsurf/era5-forecast_6steps_1.5deg_2020-01-01_2020-12-31.nc"
