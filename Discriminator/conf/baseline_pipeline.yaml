defaults:
  - target_discriminator_baselines
  - _self_

pipeline:
  stages:
    - train_discriminators
    - evaluate_standard_metrics
    - evaluate_discriminator_metrics
    - plot
  id: null
  # Every invocation writes beneath this parent in an isolated directory named
  # after its pipeline id. Reusing an id requires an explicit resume opt-in.
  runs_dir: "${baseline.output_dir}/pipeline_runs"
  resume: false
  # Exact existing models/target_discriminators directory to load when this
  # invocation evaluates or plots without training its own critics.
  input_checkpoint_dir: null
  fail_fast: true
  wandb:
    enabled: true
    project: "weather-discriminator-baselines"
    entity: null
    mode: "online"
    tags: []
    upload_checkpoints: true
    upload_evaluation_data: true
    upload_plots: true
    log_every_n_steps: 20
