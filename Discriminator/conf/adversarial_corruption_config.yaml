defaults:
  - baseline_config
  - _self_

# Cooperative search for spatially coherent perturbations which remain close
# under standard metrics but are detectable by a learned discriminator.
adversarial_corruption:
  variable: "2m_temperature"
  output_dir: "${output_dir}/adversarial_corruption"
  device: "auto"
  seed: 0

  rms_values: [0.05, 0.10, 0.20]
  generator_base_channels: 16
  generator_coarsening: 4
  minimum_effective_area_fraction: 0.20
  maximum_peak_ratio: 3.0

  batch_size: 32
  evaluation_batch_size: 32
  num_workers: 0
  joint_epochs: 10
  fresh_discriminator_epochs: 10
    #joint_epochs: 2
    #fresh_discriminator_epochs: 2
  learning_rate: 1e-4
  weight_decay: 1e-4
  pretrained_discriminator: true
  max_train_samples: 0
  max_test_samples: 0
  # Full held-out SCWD uses disk-backed response arrays. Prefer node-local
  # scratch on the cluster; null uses the system temporary directory.
  scratch_dir: null

  null_calibration_pairs: 128
  null_quantile: 0.95
  training_scwd_anchors: 512
  training_scwd_anchor_banks: 16
  scwd_quantiles: 200
  scwd_order: 2.0
  spectrum_log_eps_factor: 1e-12

  metric_loss_weight: 1.0
  detectability_weight: 1.0
    #constraint_weight: 10.0
  constraint_weight: 1.0
  fake_logit_margin: 2.0

  case_study_samples: 6
  # Chosen from the held-out generated-field fresh-discriminator logit distribution,
  # rather than taking the first fields in time order.
  case_study_logit_quantiles: [0.02, 0.20, 0.40, 0.60, 0.80, 0.98]
